# Supabase pauses a free project after a week with no activity. This asks the
# deployed API's /health every three days, which runs a query against the
# database — the activity that keeps it awake.
#
# Set the repository variable TRIPPO_API_URL (Settings → Secrets and variables
# → Actions → Variables) to the Cloud Run address. Until it is set this does
# nothing. GitHub runs scheduled workflows from the default branch only, so
# this starts once it is merged there.
name: Keep the database awake

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.TRIPPO_API_URL != '' }}
    steps:
      - name: Ask the API, which asks the database
        run: |
          body="$(curl -fsS --max-time 60 "${{ vars.TRIPPO_API_URL }}/health")"
          echo "$body"
          echo "$body" | grep -q '"database":"ok"'
