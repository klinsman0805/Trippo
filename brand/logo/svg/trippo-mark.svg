<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Trippo mark</title>
  <!-- Head: ears, crown, eye bumps and snout. The snout's flat base is the waterline. -->
  <g fill="#B8543A">
    <ellipse cx="37" cy="27" rx="9" ry="10"/>
    <ellipse cx="83" cy="27" rx="9" ry="10"/>
    <ellipse cx="60" cy="50" rx="32" ry="22"/>
    <circle cx="45" cy="38" r="12"/>
    <circle cx="75" cy="38" r="12"/>
    <path d="M20 82 V76 A22 22 0 0 1 42 54 H78 A22 22 0 0 1 100 76 V82 Z"/>
  </g>
  <!-- Inner ears and nostrils -->
  <g fill="#8F3D28">
    <ellipse cx="36" cy="26" rx="4" ry="5"/>
    <ellipse cx="84" cy="26" rx="4" ry="5"/>
    <ellipse cx="48" cy="68" rx="4.5" ry="3.5"/>
    <ellipse cx="72" cy="68" rx="4.5" ry="3.5"/>
  </g>
  <!-- Eyes -->
  <circle cx="45" cy="38" r="6.5" fill="#FFFDF9"/>
  <circle cx="75" cy="38" r="6.5" fill="#FFFDF9"/>
  <circle cx="46.5" cy="39" r="3.3" fill="#241F1A"/>
  <circle cx="76.5" cy="39" r="3.3" fill="#241F1A"/>
  <!-- Waterline (a wave, wavelength 32) and the dotted route below it -->
  <path d="M4 90 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#B8543A" stroke-width="5" stroke-linecap="round"/>
  <g fill="#B8543A" opacity="0.55">
    <circle cx="30" cy="106" r="2.5"/><circle cx="42" cy="106" r="2.5"/><circle cx="54" cy="106" r="2.5"/><circle cx="66" cy="106" r="2.5"/><circle cx="78" cy="106" r="2.5"/>
  </g>
</svg>
