# Render Blueprint: the API and the web app as one free web service.
#
# For trying the app from a phone browser with no computer: Render builds the
# Dockerfile at the root and serves the app at the service's address. Every
# push to the branch below redeploys it.
#
# Free-tier limits worth knowing before relying on it:
# - it sleeps after ~15 idle minutes; the next request waits about a minute
# - the disk is not kept, so trips are gone after a sleep or a redeploy
services:
  - type: web
    name: trippo
    runtime: docker
    plan: free
    branch: main-27p9c4
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Asked for once, when the Blueprint is created. Never committed.
      - key: GEMINI_API_KEY
        sync: false
